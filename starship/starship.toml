"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$all\
$line_break\
$character
"""

# Use the color palette
palette = "dracula"

# Define Dracula color palette
[palettes.dracula]
white = "#ffffff"
steel_gray = "#989FA3"
background = "#282a36"
current_line = "#44475a"
gray = "#313243"
foreground = "#f8f8f2"
comment = "#6272a4"
cyan = "#8be9fd"
green = "#50fa7b"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"
black = "#000000"
beige = "#F9F0E1"
beige_dark = "#6E644E"

[character]
success_symbol = "[I  ](bold fg:steel_gray)"
error_symbol = '[✘   ](bold fg:red)'
vimcmd_symbol = "[N  ](bold fg:steel_gray)"
vimcmd_replace_one_symbol = "[󰝿   ](bold fg:purple)"
vimcmd_replace_symbol = "[   ](bold fg:purple)"
vimcmd_visual_symbol = "[   ](bold fg:cyan)"

[username]
format = "[$user]($style) on "
style_user = "bold cyan"

[cmd_duration]
style = "bold yellow"
disabled = true

[aws]
symbol = "  "
style = "bold orange"

[buf]
symbol = " "

[c]
symbol = " "

[cmake]
symbol = "[](gray) "
style = "fg:white bold bg:gray"
format = ' [$symbol$version]($style)[](gray)'

[conda]
symbol = " "

[crystal]
symbol = " "

#============================================= dart =============================================
[dart]
symbol = "[](gray) "
style = "fg:white bold bg:gray"
format = ' [$symbol$version]($style)[](gray)'

#============================================= Directory =============================================
[directory]
read_only = " 󰌾"
style = "fg:steel_gray bold bg:black"
read_only_style = "bold red"
format = '[$path]($style)[$read_only]($read_only_style) '
home_symbol = "/Users/abba"
truncation_length = 0

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fennel]
symbol = " "

[fossil_branch]
symbol = " "

#============================================= Git =============================================
[git_commit]
tag_symbol = '  '

[git_branch]
symbol = "   "
style = "fg:white bold bg:gray"
format = "[](gray)[$symbol$branch]($style)"

[git_status]
format = '[ ](bg:gray)[(fg:white bg:gray)[$all_status]($style)](fg:white bg:gray)[](gray)'
style = "bg:gray"
conflicted = "[= ](fg:red bold bg:gray)"
stashed = '[\$$count ](fg:orange bg:gray)'
deleted = '[-$count ](fg:red bold bg:gray)'
renamed = '[»$count ](fg:purple bold bg:gray)'
modified = '[!$count ](fg:cyan bold bg:gray)'
staged = '[+$count ](fg:green bold bg:gray)'
untracked = '[?$count ](fg:yellow bold bg:gray)'
ahead = '[⇡ $count ](fg:green bold bg:gray)'
behind = '[⇣ $count ](fg:red bold bg:gray)'
diverged = '[⇕ \(⇡ $ahead_count⇣ $behind_count\) ](fg:orange bold bg:gray)'

