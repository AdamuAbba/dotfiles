#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

blacklist = ["scratch"]

#============================================= Configs =============================================
[[session]]
name = "dotfiles"
path = "~/Documents/dotfiles/"
startup_command = "~/.config/sesh/scripts/two-splits.sh"

#============================================= Projects =============================================
#---- React Native ----
[[session]]
name = "join-queue-business"
path = "~/Documents/join-queue-business/"
startup_command = "~/.config/sesh/scripts/three-splits.sh"

#---- rust ----
[[session]]
name = "bdk_wallet"
path = "~/Documents/bdk_wallet/"
startup_command = "~/.config/sesh/scripts/two-splits.sh -c"

[[session]]
name = "btc_test_area"
path = "~/Documents/btc_test_area/"
startup_command = "~/.config/sesh/scripts/open-in-nvim.sh 'Editor' && nvim -c 'lua require(\"persistence\").load()'"

[[session]]
name = "rust-esplora-client"
path = "~/Documents/rust-esplora-client/"
startup_command = "~/.config/sesh/scripts/two-splits.sh -w -c"

#============================================= tools =============================================
[[session]]
name = "rest"
path = "~/Documents/api-collections/"
startup_command = "~/.config/sesh/scripts/app-window-fmt.sh 'REST Client'"

[[session]]
name = "notes"
path = "~/Documents/shytypes-obs-vault/"
startup_command = "~/.config/sesh/scripts/app-window-fmt.sh 'notes'"
