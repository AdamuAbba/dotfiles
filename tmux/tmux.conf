#============================================= Modified Dracula Colors =============================================
DRACULA_BACKGROUND="#000000"
DRACULA_CURRENT_LINE="#44475a"
DRACULA_SELECTION="#44475a"
DRACULA_FOREGROUND="#f8f8f2"
DRACULA_COMMENT="#6272a4"
DRACULA_CYAN="#8be9fd"
# DRACULA_GREEN="#50fa7b"
DRACULA_GREEN="#404F3C"
DRACULA_ORANGE="#ffb86c"
DRACULA_PINK="#ff79c6"
DRACULA_PURPLE="#bd93f9"
DRACULA_RED="#ff5555"
DRACULA_YELLOW="#f1fa8c"
DRACULA_WHITE="#ffffff"
DRACULA_BLACK="#000000"
DRACULA_GRAY="#313243"
DRACULA_STEEL_GRAY="#989FA3"
DRACULA_DARK_GRAY="#14151C"
DRACULA_BROWN_GRAY="#6E6763"
set -g @window_basename_exclude_pattern "(editor|commands|notes|email|spf|ci|opencode|pr-diff)"

# #============================================= General config =============================================
set -g default-terminal "tmux-256color"
set -g automatic-rename off
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -g allow-passthrough on
set -g extended-keys on
set -g extended-keys-format csi-u
set -ga update-environment TERM
set -g base-index 1
set -g renumber-windows on
set -g visual-activity off
set -g monitor-activity off
set -s set-clipboard on
set-window-option -g mode-keys vi
set -s escape-time 0
set -g focus-events on
set -g detach-on-destroy off
set -g mouse on
set -g mode-style "fg=${DRACULA_WHITE},bg=${DRACULA_GREEN}"

#============================================= Keybindings =============================================
#--prefix key
unbind-key C-b
set-option -g prefix C-g
bind-key C-g send-prefix
#--- unbind right click menu
unbind-key -T root MouseDown3Pane
#--reload config
unbind-key d
unbind-key &
unbind-key r
# bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"
 bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe "xclip -sel clip -i"
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "_" split-window -v -c "#{pane_current_path}"
unbind-key c
# -- Copy mode
bind-key v copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane
#-- Floating pane
bind f run-shell -b "$HOME/.config/tmux/scripts/scratch-popup-toggle.sh"

unbind-key -T prefix 0
unbind-key -T prefix 1
unbind-key -T prefix 2
unbind-key -T prefix 3
unbind-key -T prefix 4
unbind-key -T prefix 5
unbind-key -T prefix 6
unbind-key -T prefix 7
unbind-key -T prefix 8
unbind-key -T prefix 9
#============================================= Plugins =============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'christoomey/vim-tmux-navigator'

run-shell ~/.config/tmux/plugins/tmux-which-key/which-key.tmux

#============================================= Nucc/tmux-which-key =============================================
# set -g @which-key-popup-bg "${DRACULA_BLACK}"
# set -g @which-key-popup-fg "${DRACULA_WHITE}"
# set -g @which-key-popup-x "C"
# set -g @which-key-popup-y "C"
# set -g @which-key-popup-width '100'
# set -g @which-key-popup-height '13'
# set -g @which-key-config '~/.config/tmux/plugin-configs/tmux-which-key/default.json'

set -g @which-key-trigger 'None'
bind-key -n C-a run-shell 'tmux display-popup -E -h 16 -w 100 -x C -y C -S "fg=#ffffff" -s "bg=#000000" "~/.config/tmux/plugins/tmux-which-key/scripts/which-key.sh --config ~/.config/tmux/plugin-configs/tmux-which-key/default.json #{pane_id}"'

#============================================= vim-tmux-navigator =============================================
set -g @vim_navigator_mapping_left "C-h"
set -g @vim_navigator_mapping_right "C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""
set -g @vim_navigator_prefix_mapping_clear_screen ""
# unbdind "Prefix + p" go to previous window
unbind-key p

#============================================= statusbar =============================================
set -g status-position top
# when a pane process exits (clear spacer if nvim closed)
# set-hook -g pane-exited "set -g status-format[1] \"\"; set -g status on"
# set-hook -g pane-died "set -g status-format[1] \"\"; set -g status on"
#
# # when switching panes
# set-hook -g pane-focus-in "if-shell '[ \"#{pane_current_command}\" = \"nvim\" ]' \
#   'set -g status-format[1] \" \" ; set -g status 2' \
#   'set -g status-format[1] \"\" ; set -g status on'"

#-- Status line options
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100
set -g status-bg "#000000"
set -g status-fg "#000000"
set -g status-style bg=${DRACULA_BLACK}

#---session name format
set -g status-left "\
#[fg=${DRACULA_BACKGROUND},bg=${DRACULA_BLACK}]\
#[fg=#{?client_prefix,$DRACULA_PURPLE,$DRACULA_STEEL_GRAY},bg=${DRACULA_BACKGROUND},bold] S:\
#[default]#[bg=${DRACULA_BACKGROUND}]\
#[fg=#{?client_prefix,$DRACULA_PURPLE,$DRACULA_STEEL_GRAY},bg=${DRACULA_BACKGROUND},bold][#S] \
#[fg=${DRACULA_BACKGROUND},bg=${DRACULA_BLACK}] \
"

#---Active window format
set -g window-status-current-format "\
#[fg=${DRACULA_GRAY},bg=${DRACULA_BLACK}]\
#[fg=#{?client_prefix,$DRACULA_PURPLE,$DRACULA_WHITE},bg=${DRACULA_BACKGROUND},bold] #{?#{m/ri:#{@window_basename_exclude_pattern},#{window_name}},#{window_name},#{b:pane_current_path}}\
#[default]#[bg=${DRACULA_BACKGROUND}]\
#[fg=#{?client_prefix,$DRACULA_PURPLE,$DRACULA_GRAY},bg=${DRACULA_BACKGROUND},bold] \
#[fg=${DRACULA_GRAY},bg=${DRACULA_BLACK}]\
"

#---Inactive window format
set -g window-status-format "\
#[fg=${DRACULA_BLACK},bg=${DRACULA_BLACK}]\
#[fg=#{?client_prefix,$DRACULA_PURPLE,$DRACULA_STEEL_GRAY},bg=${DRACULA_BLACK},bold,noreverse] #{?#{m/ri:#{@window_basename_exclude_pattern},#{window_name}},#{window_name},#{b:pane_current_path}}\
#[default]#[bg=${DRACULA_GRAY}]\
#[fg=#{?client_prefix,$DRACULA_PURPLE,$DRACULA_WHITE},bg=${DRACULA_BLACK},bold,noreverse] \
#[fg=${DRACULA_BLACK},bg=${DRACULA_BLACK}]\
"

#---Running command in current pane
# set -g status-right "\
# #[fg=${DRACULA_GRAY},bg=${DRACULA_BLACK}]\
# #[fg=#{?client_prefix,$DRACULA_PURPLE,$DRACULA_WHITE},bg=${DRACULA_GRAY},bold] \
# #[default]#[bg=${DRACULA_GRAY}] \
# #[fg=#{?client_prefix,$DRACULA_PURPLE,$DRACULA_WHITE},bg=${DRACULA_GRAY},bold]#{pane_current_command}\
# #[fg=${DRACULA_GRAY},bg=${DRACULA_BLACK}]\
# "

#--- hide for now
set -g status-right "$(printf '\"u200A%.0s')"

#============================================= tmux-fzf-url =============================================
set -g @fzf-url-bind 'x'
set -g @fzf-url-history-limit '2000'

#============================================= sesh =============================================
unbind-key t
unbind-key s
# bind-key s run-shell $HOME/.config/tmux/scripts/sesh.sh

#============================================= popup config =============================================
set-option -g popup-border-lines rounded
set-option -g popup-style "bg=${DRACULA_BLACK}"
set-option -g popup-border-style "bg=${DRACULA_BLACK},fg=${DRACULA_WHITE}"

#============================================= menu config =============================================
set-option -g menu-border-lines rounded
set-option -g menu-border-style "bg=${DRACULA_BLACK},fg=${DRACULA_WHITE}"
set-option -g menu-style "bg=${DRACULA_BLACK}"
set-option -g menu-selected-style "bg=${DRACULA_BLACK}"

#============================================= pane =============================================
set -g pane-border-lines simple
set -g pane-border-indicators colour
set -g pane-active-border-style "fg=#50fa7b"
set -g pane-base-index 1
set-window-option -g pane-base-index 1

#============================================= message =================================================
set-option -g message-command-style "bg=${DRACULA_BLACK},fg=${DRACULA_WHITE}"
set-option -g message-style "bg=${DRACULA_BLACK},fg=${DRACULA_WHITE}"

#---------Do Not Reorder----------------------------------------
#---------Leave at bottom---------------------------------------
#---------Resize pane keeps rebinding these---------------------
unbind-key -T root H
unbind-key -T root L
unbind-key -T prefix H
unbind-key -T prefix L
unbind-key -T prefix c

bind-key -T root M-[ previous-window

bind-key -T root M-] next-window
#============================================= Initial TPM on a new device =======================================
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

run '~/.config/tmux/plugins/tpm/tpm'
